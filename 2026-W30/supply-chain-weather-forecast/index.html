<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supply Chain Weather | 2026-W30</title>
  <meta name="description" content="W30 Supply Chain Weather forecast for the entry exception board." />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <p class="kicker">Supply Chain Weather · 2026-W30</p>
      <h1><span>Supply Chain</span> Weather</h1>
      <p>A separate-station forecast for entry exception files. No fake composite score.</p>
      <div class="signal-band" aria-hidden="true"><svg viewBox="0 0 1200 120"><path d="M0 62H130l18-30 18 68 20-98 22 112 18-60 22 28 16-10h126l16-28 20 62 22-102 24 112 18-56 23 24 17-14h132l16-26 20 58 22-96 22 104 20-50 22 24 16-14h220" /></svg></div>
    </header>
    <section class="hero" id="mapView"><div><span>Headline</span><h2 id="headline"></h2><p id="dek"></p></div><aside><strong>Forecast horizon</strong><p id="horizon"></p><strong>Confidence</strong><p id="confidence"></p></aside></section>
    <section class="stations" id="stations" aria-label="Weather stations"></section>
    <section class="cards" id="cards" aria-label="Reference cards"></section>
    <section class="operator" id="operatorView"><p class="kicker">Operator translation</p><h2 id="translation"></h2><ul id="watchlist"></ul></section>
    <section class="newsletter" id="newsletterView"><p class="kicker">Newsletter insert</p><h2 id="insertTitle"></h2><h3 id="insertHeadline"></h3><p id="insertBody"></p><strong>Operator translation</strong><p id="insertOperator"></p></section>
    <section class="sources"><p class="kicker">Sources</p><ul id="sources"></ul></section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
