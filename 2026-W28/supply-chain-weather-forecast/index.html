<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supply Chain Weather | 2026-W28</title>
  <meta name="description" content="W28 Supply Chain Weather forecast for the proof-and-booking queue." />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="masthead"><p class="kicker">Supply Chain Weather · 2026-W28</p><h1>Proof-and-booking weather map</h1><p>A separate-station view of import front-loading, proof files, cost pressure and strategic inputs.</p></header>
    <section class="hero"><div><span>Headline</span><h2 id="headline"></h2><p id="dek"></p></div><aside><strong>Forecast horizon</strong><p id="horizon"></p><strong>Confidence</strong><p id="confidence"></p></aside></section>
    <section class="stations" id="stations" aria-label="Weather stations"></section>
    <section class="cards" id="cards" aria-label="Reference cards"></section>
    <section class="operator"><p class="kicker">Operator translation</p><h2 id="translation"></h2><ul id="watchlist"></ul></section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
